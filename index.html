<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A modern, fully featured calculator built with HTML, CSS and JavaScript. Supports arithmetic operations, keyboard input, live results and calculation history." />
  <title>Aurora Calculator </title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- ===================== CALCULATOR ===================== -->
    <section class="calculator" aria-label="Calculator">

      <header class="calc-header">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">∑</span>
          <div class="brand-text">
            <h1>Aurora Calculator</h1>
            
          </div>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.5"/>
              <path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
          <button id="soundToggle" class="icon-btn" type="button" aria-label="Toggle key sounds" aria-pressed="false" title="Toggle key sounds">
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/>
              <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>
            </svg>
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/>
              <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Display screen -->
      <div class="display" id="display" aria-live="polite">
        <div class="display-history" id="displayExpression" aria-hidden="true">&nbsp;</div>
        <div class="display-row">
          <output class="display-output" id="displayOutput" for="keys">0</output>
          <button class="copy-btn" id="copyResult" type="button" aria-label="Copy result to clipboard" title="Copy result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
        <div class="display-preview" id="displayPreview" aria-hidden="true">&nbsp;</div>
      </div>

      <!-- Keypad -->
      <div class="keys" id="keys" role="group" aria-label="Calculator keypad">
        <button class="key key-fn" data-action="clear" type="button">AC</button>
        <button class="key key-fn" data-action="negate" type="button" aria-label="Toggle sign">±</button>
        <button class="key key-fn" data-action="percent" type="button" aria-label="Percent">%</button>
        <button class="key key-op" data-operator="÷" type="button" aria-label="Divide">÷</button>

        <button class="key" data-digit="7" type="button">7</button>
        <button class="key" data-digit="8" type="button">8</button>
        <button class="key" data-digit="9" type="button">9</button>
        <button class="key key-op" data-operator="×" type="button" aria-label="Multiply">×</button>

        <button class="key" data-digit="4" type="button">4</button>
        <button class="key" data-digit="5" type="button">5</button>
        <button class="key" data-digit="6" type="button">6</button>
        <button class="key key-op" data-operator="−" type="button" aria-label="Subtract">−</button>

        <button class="key" data-digit="1" type="button">1</button>
        <button class="key" data-digit="2" type="button">2</button>
        <button class="key" data-digit="3" type="button">3</button>
        <button class="key key-op" data-operator="+" type="button" aria-label="Add">+</button>

        <button class="key key-wide" data-digit="0" type="button">0</button>
        <button class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button>
        <button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>

        <button class="key key-fn key-backspace" data-action="backspace" type="button" aria-label="Backspace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><line x1="12.5" y1="9.5" x2="17.5" y2="14.5"/><line x1="17.5" y1="9.5" x2="12.5" y2="14.5"/>
          </svg>
          <span class="visually-hidden">Delete</span>
        </button>
      </div>
    </section>

    <!-- ===================== HISTORY PANEL ===================== -->
    <aside class="history" aria-label="Calculation history">
      <div class="history-header">
        <h2>History</h2>
        <button id="clearHistory" class="text-btn" type="button">Clear all</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
      <p class="history-empty" id="historyEmpty">No calculations yet.<br />Your results will appear here.</p>
      <footer class="history-footer">
        <kbd>0–9</kbd> digits · <kbd>+ − * /</kbd> ops · <kbd>Enter</kbd> = · <kbd>⌫</kbd> del · <kbd>Esc</kbd> clear
      </footer>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
